[project]
name = "voxentity-eu"
version = "0.1.0"
description = "Open evaluation of exact spoken-entity capture in German and French"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "VoxEntity-EU contributors" }]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "jiwer>=3.0",
]

[project.optional-dependencies]
tts = [
    "torch>=2.2",
    "transformers>=4.50",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
]
asr-whisper = [
    "torch>=2.2",
    "transformers>=4.50",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
]
asr-voxtral = [
    "torch>=2.2",
    "transformers>=4.53",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
]
hf = ["huggingface_hub>=0.23", "datasets>=2.19"]
space = ["gradio>=4.36"]
parquet = ["pandas>=2.2", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
voxentity = "voxentity_eu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxentity_eu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
