name: ci

on: [push, pull_request]

jobs:
  core:
    # core scoring stays CPU-only and offline: no torch, no model downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r uv-core.lock && pip install --no-deps -e . && pip install pytest ruff
      - run: ruff check .
      - run: pytest
